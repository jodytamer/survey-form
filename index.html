<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <header class="card-head">
      <h1 id="title">CS Student Survey</h1>
      <p id="description">Help us understand how computer science students are learning to code. Takes less than a minute.</p>
    </header>

    <form id="survey-form">

      <div class="field">
        <label id="name-label" for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required />
      </div>

      <div class="field">
        <label id="email-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="field">
        <label id="number-label" for="number">Age</label>
        <input type="number" id="number" name="number" placeholder="Age" min="10" max="100" />
      </div>

      <div class="field">
        <label for="dropdown">Which best describes your current role?</label>
        <select id="dropdown" name="role">
          <option value="" disabled selected>Select an option</option>
          <option value="student">Student</option>
          <option value="self-taught">Self-taught learner</option>
          <option value="bootcamp">Bootcamp grad</option>
          <option value="developer">Working developer</option>
          <option value="other">Other</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>How would you rate your current coding skills?</legend>

        <label for="beginner"><input id="beginner" type="radio" name="rating" value="beginner" /> Beginner</label>
        <label for="intermediate"><input id="intermediate" type="radio" name="rating" value="intermediate" /> Intermediate</label>
        <label for="advanced"><input id="advanced" type="radio" name="rating" value="advanced" /> Advanced</label>

      </fieldset>

      <fieldset class="field">
        <legend>What would you like to see improved? (check all that apply)</legend>

        <label for="frontend"><input id="frontend" type="checkbox" name="checkbox" value="frontend" /> Front-end projects</label>
        <label for="backend"><input id="backend" type="checkbox" name="checkbox" value="backend" /> Back-end projects</label>
        <label for="algorithms"><input id="algorithms" type="checkbox" name="checkbox" value="algorithms" /> Algorithms & data structures</label>
        <label for="career"><input id="career" type="checkbox" name="checkbox" value="career" /> Career / freelancing advice</label>

      </fieldset>

      <div class="field">
        <label for="comments">Any comments or suggestions?</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Enter your comment here..."></textarea>
      </div>

      <button id="submit" type="submit">Submit</button>

    </form>
  </main>

</body>
</html>
